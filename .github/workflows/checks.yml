name: Development checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  update-flow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check update and recovery in an isolated container
        run: bash scripts/test-update-flow.sh
  online-api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: smartplan_check
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartplan_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      SMARTPLAN_TEST_DSN: host=127.0.0.1 port=55433 dbname=smartplan_check user=postgres password=disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/online/requirements.lock
      - run: python -m pip check
      - name: PostgreSQL-, Speicher- und OneDrive-Vertraege pruefen
        run: |
          python -m unittest discover -s backend/online -p test_online.py -v
          python -m unittest discover -s backend/online -p test_report_integrity_pg.py -v
          python -m unittest discover -s backend/online -p test_instance_isolation.py -v
          python -m unittest discover -s backend/online -p 'test_company*isolation*.py' -v
          python -m unittest discover -s backend/online -p test_organization_http.py -v
          python -m unittest discover -s backend/online -p test_inventory_article_references_api.py -v
          PYTHONPATH=backend python -m unittest test_project_creation_replay -v
          python -m unittest discover -s backend/online -p test_project_milestones_http.py -v
          python -m unittest discover -s backend/online -p test_offline_instance_binding.py -v
          PYTHONPATH=backend python -m unittest test_project_creation_counterreview.ProjectCreationPostgresCounterreview -v
          PYTHONPATH=backend python -m unittest online.test_project_creation_journal online.test_project_creation_journal_pg -v
          python -m unittest discover -s backend/online -p test_organization_pg.py -v
          python -m unittest discover -s backend/online -p test_purchasing_journey.py -v
          python -m unittest discover -s backend/online -p test_purchasing_catalog_http.py -v
          python -m unittest discover -s backend/online -p test_postgres_purchasing_integration.py -v
          python -m unittest discover -s backend/online -p test_portal_http.py -v
          python -m unittest discover -s backend/online -p test_portal_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_portal_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_allocations_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_allocations_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_allocations_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_components_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_components_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_components_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_refunds_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_refunds_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_refunds_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_capacity_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_capacity_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_capacity_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_refunds_v2_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_refunds_v2_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_refunds_v2_integration.py -v
          python -m unittest discover -s backend/online -p test_accounting_profile_http.py -v
          python -m unittest discover -s backend/online -p test_accounting_profile_journey.py -v
          python -m unittest discover -s backend/online -p test_postgres_accounting_profile_integration.py -v
          python -m unittest discover -s backend/online -p test_plans_online.py -v
          python -m unittest discover -s backend/online -p test_plan_imports.py -v
          python -m unittest discover -s backend/online -p test_import_cancellation.py -v
          python -m unittest discover -s backend/online -p test_plan_deletions.py -v
          python -m unittest discover -s backend/online -p test_workspace_api.py -v
          python -m unittest discover -s backend/online -p test_inquiry_attachments_api.py -v
          python -m unittest discover -s backend/online -p test_business_intake_contract.py -v
          python -m unittest discover -s backend/online -p 'test_integration*.py' -v
          python -m unittest discover -s backend/online -p test_release.py -v
          python -m unittest discover -s backend/online -p test_release_workspace.py -v
          python -m unittest discover -s backend/online -p test_release_attachments.py -v
          python -m unittest discover -s backend/online -p test_release_integrations.py -v
          python -m unittest discover -s backend/online -p test_storage.py -v
          python -m unittest discover -s backend/online -p test_onedrive.py -v
          python -m unittest discover -s backend/online -p 'test_business*.py' -v
          python -m unittest -v online.test_communication_history_pg
          python -m unittest discover -s backend/online -p test_accounting_year_package_pg.py -v
          python -m unittest -v online.test_accounting_year_package_v2_pg
          python -m unittest -v online.test_year_values_full_financial_restore_pg
          python -m unittest discover -s backend/online -p test_accounting_open_items_pg.py -v
          python -m unittest discover -s backend/online -p test_accounting_year_openings_pg.py -v
          python -m unittest discover -s backend/online -p 'test_customer_workspace*.py' -v
          python -m unittest discover -s backend/online -p 'test_assistant*.py' -v
          python -m unittest discover -s backend/online -p 'test_company_events*.py' -v
          python -m unittest discover -s backend/online -p 'test_company_handover*.py' -v
          python -m unittest discover -s backend/online -p test_customer_execution_journey_pg.py -v
          python -m unittest discover -s backend/online -p test_customer_finance_service_journey_pg.py -v
          python -m unittest discover -s backend/online -p test_release_business.py -v
          python -m unittest discover -s backend/online -p 'test_provisioning*.py' -v
      - name: Check online units, scripts and real HTTPS runtime
        run: |
          bash -n deploy/hetzner/online/*.sh
          systemd-analyze verify deploy/hetzner/online/*.service deploy/hetzner/online/*.timer
          smartplan_caddy_test=$(mktemp -d)
          trap 'rm -rf -- "$smartplan_caddy_test"' EXIT
          bash deploy/hetzner/https/fetch-caddy.sh "$smartplan_caddy_test"
          SMARTPLAN_CADDY_BINARY="$smartplan_caddy_test/caddy" python backend/online/test_runtime.py
          SMARTPLAN_CADDY_BINARY="$smartplan_caddy_test/caddy" python -m unittest discover -s backend/online -p test_release_tls.py -v
  https-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated HTTPS setup with real Caddy and verified TLS
        run: |
          bash -n deploy/hetzner/https/install-https.sh deploy/hetzner/https/fetch-caddy.sh
          python3 -m unittest discover -s deploy/hetzner/https -p test_dns.py -v
          systemd-analyze verify deploy/hetzner/https/smartplan-https.service
          smartplan_caddy_test=$(mktemp -d)
          trap 'rm -rf -- "$smartplan_caddy_test"' EXIT
          bash deploy/hetzner/https/fetch-caddy.sh "$smartplan_caddy_test"
          SMARTPLAN_CADDY_BINARY="$smartplan_caddy_test/caddy" python3 deploy/hetzner/https/test_https.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/online/requirements.lock
      - run: python -m pip install -r backend/online/requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s backend -v
      - name: Verify the deterministic source component inventory
        run: |
          python -m unittest discover -s scripts -p test_product_inventory.py -v
          python scripts/product-inventory.py --output "$RUNNER_TEMP/product-source-bom.json"
          cmp docs/evidence/product-source-bom.json "$RUNNER_TEMP/product-source-bom.json"
      - name: Require synthetic Gmail bridge retry and scope contracts
        run: node integrations/google_apps_script/test_gmail.js
  business-services:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: backend:backend/business_tests:backend/online:scripts
      PYTHONDONTWRITEBYTECODE: '1'
      SMARTPLAN_SRGB_ICC: /usr/share/color/icc/ghostscript/srgb.icc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and actual local invoice validators
        run: |
          python -m pip install -r backend/online/requirements.lock
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless ghostscript icc-profiles-free
          python scripts/fetch-einvoice-tools.py "$RUNNER_TEMP/smartplan-invoice-tools" --github-env "$GITHUB_ENV"
          python -m unittest discover -s scripts -p test_einvoice_tools.py -v
      - name: Require all commercial, SMTP and official e-invoice tests
        run: |
          python -m unittest discover -s backend/business_tests -v
          python -m unittest discover -s backend -p test_business_contact_snapshot.py -v
      - name: Test responsive browser client with actual auth and API
        env:
          SMARTPLAN_BROWSER_TEST_PYTHON: python
          SMARTPLAN_BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/smartplan-browser-previews
          # The runner's packaged Chrome has the vendor AppArmor userns
          # profile. An unprofiled /usr/bin/chromium cannot start its sandbox
          # on Ubuntu 24.04; keep both sandboxing and the host policy enabled.
          SMARTPLAN_CHROMIUM_BINARY: /opt/google/chrome/chrome
        run: |
          smartplan_browser_log="$RUNNER_TEMP/smartplan-browser-check.log"
          set +e
          {
            node --test web/office/tests/*.test.mjs &&
            npm ci --prefix web/office --ignore-scripts --no-audit --no-fund &&
            cd web/office &&
            test -x "$SMARTPLAN_CHROMIUM_BINARY" &&
            "$SMARTPLAN_CHROMIUM_BINARY" --version &&
            node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=accounting-openings node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=project-economics node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=asset-provenance node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=personnel-workflow node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=travel-allowances node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=travel-v3 node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=sales node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=communication-history node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=project-context node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=project-tasks node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=project-milestones node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=project-customer node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=inventory-article-refs node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=time-tracking node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-transition node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-factor node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-periods node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-factor-periods node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-entitlements node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-travel-tax-policies node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-calculation-cases node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-wage-interruptions node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-annual-basis node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-zero-account node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-oneoff-cases node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-multiple-cases node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-positive-correction node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=mobile-login node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-statements node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=assistant node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=company-events node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=speech node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=company-handover node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=migrations node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=custom-fields node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=service node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=maintenance-contracts node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=privacy-cases node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=payroll-cash node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=historical-assets node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=accounting-open-items node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=bank-reconciliation node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=resource-custody node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=purchase-changes node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=catalog-imports node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=catalog-prices node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=accessibility node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=invoice-chain node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=inventory-counts node tests/e2e.cjs &&
            SMARTPLAN_BROWSER_WORKFLOW=company-overview node tests/e2e.cjs &&
            node tests/customer-workspace-e2e.cjs &&
            node tests/accounting-euer-e2e.cjs &&
            node tests/accounting-year-package-e2e.cjs &&
            node tests/accounting-year-package-v2-e2e.cjs &&
            node tests/accounting-year-values-profile-void-e2e.cjs
          } 2>&1 | tee "$smartplan_browser_log"
          smartplan_browser_exit=${PIPESTATUS[0]}
          set -e
          if [ "$smartplan_browser_exit" -ne 0 ]; then
            python - "$smartplan_browser_log" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          if 'SMARTPLAN_BROWSER_FAILURE_BEGIN' in lines:
              start = lines.index('SMARTPLAN_BROWSER_FAILURE_BEGIN') + 1
              end = lines.index('SMARTPLAN_BROWSER_FAILURE_END', start) if 'SMARTPLAN_BROWSER_FAILURE_END' in lines[start:] else len(lines)
              selected = lines[start:end]
          else:
              selected = lines if len(lines) <= 50 else lines[:35] + ['[middle diagnostic lines omitted]'] + lines[-15:]
          detail = '\n'.join(line[:500] for line in selected)[:25000]
          print('::error title=Browser acceptance::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$smartplan_browser_exit"
      - name: Upload synthetic browser acceptance screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Smartplan-Browser-Previews
          path: ${{ runner.temp }}/smartplan-browser-previews/
          if-no-files-found: error
          retention-days: 14
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real backend for client integration test
        run: |
          python -m venv ../backend/.venv
          ../backend/.venv/bin/python -m pip install -r ../backend/requirements.lock -r ../backend/online/requirements.lock
          ../backend/.venv/bin/python -m pip check
      - name: Check private Linux pilot launcher and backup
        run: |
          bash -n ../deploy/hetzner/install-pilot.sh
          bash -n ../deploy/hetzner/run-pilot.sh
          systemd-analyze verify ../deploy/hetzner/smartplan-pilot.service ../deploy/hetzner/smartplan-pilot-backup.service ../deploy/hetzner/smartplan-pilot-backup.timer
          ../backend/.venv/bin/python -m unittest discover -s ../deploy/hetzner -p test_pilot.py -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Check native release configuration and package contracts
        run: |
          python ../scripts/native-release.py source
          python -m unittest discover -s ../scripts -p test_native_release.py -v
      - run: flutter analyze
      - name: Require bounded rendering with the real native PDF engine
        shell: bash
        run: |
          umask 0077
          clang --version
          smartplan_pdf_log="$RUNNER_TEMP/smartplan-native-pdf.log"
          set +e
          flutter test --no-pub test/mail_attachment_preview_widget_test.dart --tags native_pdf --reporter expanded 2>&1 | tee "$smartplan_pdf_log"
          smartplan_pdf_exit=${PIPESTATUS[0]}
          set -e
          if [ "$smartplan_pdf_exit" -ne 0 ]; then
            python - "$smartplan_pdf_log" <<'PY'
          import pathlib, sys
          detail = '\n'.join(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()[-100:])[-25000:]
          print('::error title=Native PDF smoke::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$smartplan_pdf_exit"
      - name: Test app and retain bounded failure diagnostics
        shell: bash
        env:
          SMARTPLAN_CAPTURE_UI: '1'
          SMARTPLAN_UI_OUTPUT: ${{ runner.temp }}/smartplan-ui-previews
        run: |
          umask 0077
          smartplan_test_log="$RUNNER_TEMP/smartplan-flutter-tests.log"
          smartplan_test_report="$RUNNER_TEMP/smartplan-flutter-tests.jsonl"
          set +e
          flutter test --exclude-tags native_pdf --reporter expanded --file-reporter "json:$smartplan_test_report" 2>&1 | tee "$smartplan_test_log"
          smartplan_test_exit=${PIPESTATUS[0]}
          set -e
          if [ "$smartplan_test_exit" -ne 0 ]; then
            python ../scripts/report-flutter-test-failures.py --report "$smartplan_test_report" --log "$smartplan_test_log" --summary "$GITHUB_STEP_SUMMARY"
          fi
          exit "$smartplan_test_exit"
      - name: Upload real widget previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Smartplan-UI-Previews
          path: ${{ runner.temp }}/smartplan-ui-previews/
          if-no-files-found: error
          retention-days: 14
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: flutter build windows --release
          - os: macos-26-intel
            command: flutter build ios --simulator --debug --dart-define=API_URL=https://office.smartplan-hofmann.de --dart-define=API_VERSION=v1
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native release configuration
        shell: bash
        run: |
          python ../scripts/native-release.py source
          python -m unittest discover -s ../scripts -p test_flutter_failure_reporter.py -v
      - name: Check Visual C++ ATL for protected device storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smartplanVswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $smartplanAtl = & $smartplanVswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $smartplanAtl) { throw 'Visual Studio C++ x64 and ATL components are required for the offline storage plugin.' }
      - name: Install Windows backend for client integration test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv ../backend/.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ../backend/.venv/Scripts/python.exe -m pip install -r ../backend/requirements.lock -r ../backend/online/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ../backend/.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smartplanTestPython = (Resolve-Path '../backend/.venv/Scripts/python.exe').Path
          "SMARTPLAN_TEST_PYTHON=$smartplanTestPython" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test complete offline Windows Python dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smartplanWheels = Join-Path $env:RUNNER_TEMP 'smartplan-windows-python-wheels'
          New-Item -ItemType Directory -Force $smartplanWheels | Out-Null
          python -m pip download --only-binary=:all: --dest $smartplanWheels --requirement ../backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/native-release.py wheels --directory $smartplanWheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/test-windows-offline-update.py --wheels-dir $smartplanWheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/package-windows-support.py (Join-Path $env:RUNNER_TEMP 'Smartplan_Windows_Start_und_Sicherung.zip') --wheels-dir $smartplanWheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SMARTPLAN_WINDOWS_WHEELS=$smartplanWheels" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload complete offline Windows support package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Smartplan-Windows-Start-und-Sicherung
          path: |
            ${{ runner.temp }}/Smartplan_Windows_Start_und_Sicherung.zip
            ${{ runner.temp }}/Smartplan_Windows_Start_und_Sicherung.zip.sha256
          if-no-files-found: error
